name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Corre en cada push. Sin navegador: son segundos.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # dist/ está commiteado porque jsDelivr sirve archivos del repo. Si el build
      # produce algo distinto de lo commiteado, es que alguien editó dist/ a mano o
      # se olvidó de correr el build — y los consumidores estarían recibiendo algo
      # que no sale de los tokens.
      - name: dist/ está al día con los tokens
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ no coincide con el build. Corré 'npm run build' y commiteá el resultado."
            exit 1
          fi

      # Va antes que todo: el repo es PÚBLICO, así que un dato de cliente acá no
      # es un riesgo preventivo sino una filtración.
      - name: Datos de cliente
        run: npm run check:privacy

      - name: Reglas del sistema
        run: npm run check:tokens

      - name: Contraste WCAG en ambos temas
        run: npm run check:contrast

  # Job aparte porque instala un navegador (~130 MB). Solo corre cuando el cambio
  # puede afectar lo que se ve: los assets, las tipografías o el script que los usa.
  visual:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'visual')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: og.png al día y tipografías completas
        run: npm run check:visual
